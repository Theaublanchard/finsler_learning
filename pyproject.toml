[project]
name = "finsler-learning"
version = "0.1.0"
description = "Learning Finsler metric for latent space exploration"
readme = "README.md"
authors = [
    { name = "Theau Blanchard", email = "theau.blanchard@inria.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.2",
    "geodesic-toolbox",
    "geomloss>=0.3.1",
    "ipykernel>=7.3.0",
    "kmedoids>=0.5.5",
    "matplotlib>=3.11.1",
    "monai>=1.6.0",
    "nibabel>=5.4.2",
    "nnunetv2>=2.8.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pot>=0.9.7.post1",
    "pytorch-msssim>=1.0.0",
    "pytorchfwd",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
    "torcheval>=0.0.7",
    "torchmetrics[image]>=1.9.0",
    "torchquad>=0.6.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
]

[project.scripts]
shepplogan-pipeline = "finsler_learning.shepplogan_pipeline.shepplogan_pipeline:cli"
komatsuna-pipeline = "finsler_learning.komatsuna_pipeline.komatsuna_pipeline:cli"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
geodesic-toolbox = { git = "https://github.com/Theaublanchard/geodesic_toolbox", rev = "777867c433529ca2595f289f0d5312336170f6c4" }
pytorchfwd = { git = "https://github.com/Theaublanchard/PyTorch-FWD", rev = "f41d82a911aa18b7c28aa0d93f98630d7518054f" }

[tool.ruff]
line-length = 95